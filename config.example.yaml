# Top-level server configuration block.
server:
  # Address and port the HTTP server binds to. Format: host:port.
  listen_address: 0.0.0.0:8080

# These values default to 120s, 30s, and 30s when omitted. Changes apply after restart.
# How long to wait after a provider failure before allowing it to be retried.
cooldown: 120s
# How long to wait before probing a recovered provider again.
recovery_wait: 30s
# Max time to wait for response headers from an upstream provider before timing out.
response_header_timeout: 30s

# Treat provider HTTP 404 responses as failover failures. Defaults to false.
failover_on_404: false

# Minimum log level to emit (INFO, WARN, or ERROR).
# Defaults to WARN. INFO includes detailed lifecycle diagnostics (Provider
# selection and successes, Cooldown and Recovery Wait transitions, and
# cancellation). WARN suppresses those INFO-only events but retains Failover
# Failure and stream-abort events. ERROR is the strictest threshold and emits
# only ERROR-level events. At INFO, errors may include bounded Provider error
# messages or stream tails; prompts, request bodies, authorization headers, and
# API keys are never logged, and response content is suppressed at WARN/ERROR.
log_level: WARN

# Reasoning effort forwarded to every upstream request. Allowed values:
# none, low, medium, high, xhigh, max, null.
# Set to null (~) to disable forwarding and strip any client-supplied reasoning_effort.
# This field is required — omitting it fails validation.
# Default when you want reasoning: max. Most of providers already support it. See README for details.
reasoning_effort: max

# List of upstream Gonka Providers the proxy can route to. These are
# placeholders, not real credentials. The legacy model_alias form below is
# still supported and automatically serves the gonka Virtual Model.
#
# Optional per-provider reasoning_effort overrides the global value for that
# provider with any allowed value; null (~) strips the field entirely (for
# providers that reject the parameter); omit it to inherit global.
providers:
  - name: primary
    base_url: https://provider.example/v1
    api_key: replace-with-provider-key
    model_alias: provider-model-name
    priority: 100
  - name: backup
    base_url: https://backup.example/v1
    api_key: replace-with-provider-key
    model_alias: backup-model-name
    priority: 50
    reasoning_effort: ~

# Optional multi-model routing. When present, model_routes is authoritative.
# Each Provider may map a Virtual Model to its upstream Model Alias. A route's
# provider list is ordered explicitly; omit it to use global priority order.
# Providers without an alias for a route are skipped.
#
# providers:
#   - name: primary
#     base_url: https://provider.example/v1
#     api_key: replace-with-provider-key
#     model_aliases:
#       gonka: deepseek-v4-flash-0731
#       deepseek-v4-flash-0731: deepseek-v4-flash-0731
#     priority: 100
# model_routes:
#   gonka:
#     providers: [primary]
#   deepseek-v4-flash-0731:
#     providers: [primary]
